<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1000" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Assignment 3 — Kubernetes Architecture (local k3d cluster)</text>

  <!-- Internet -->
  <ellipse cx="500" cy="70" rx="70" ry="25" fill="#e8eef7" stroke="#3b5998" stroke-width="1.5"/>
  <text x="500" y="75" font-size="13" text-anchor="middle" fill="#1a1a2e">Internet / User</text>
  <line x1="500" y1="95" x2="500" y2="120" stroke="#3b5998" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cluster boundary -->
  <rect x="60" y="120" width="880" height="560" rx="10" fill="#fafbfc" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="80" y="140" font-size="13" font-weight="bold" fill="#555">k3d Cluster "devops-k8s" — Namespace: devops-app</text>

  <!-- Ingress -->
  <rect x="410" y="150" width="180" height="45" rx="6" fill="#ffe8cc" stroke="#cc7a00" stroke-width="1.5"/>
  <text x="500" y="172" font-size="13" text-anchor="middle" fill="#663c00">Ingress (Traefik)</text>
  <text x="500" y="187" font-size="10" text-anchor="middle" fill="#8a5a00">host port 8080 → :80</text>
  <line x1="500" y1="195" x2="500" y2="220" stroke="#cc7a00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- frontend service -->
  <rect x="400" y="220" width="200" height="35" rx="6" fill="#d9f2e6" stroke="#1e8a5f" stroke-width="1.5"/>
  <text x="500" y="242" font-size="12" text-anchor="middle" fill="#0f5132">Service: frontend-service</text>
  <line x1="500" y1="255" x2="500" y2="278" stroke="#1e8a5f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- frontend pod -->
  <rect x="380" y="278" width="240" height="55" rx="6" fill="#c9f0e0" stroke="#1e8a5f" stroke-width="1.5"/>
  <text x="500" y="298" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f5132">Pod: frontend</text>
  <text x="500" y="313" font-size="10" text-anchor="middle" fill="#0f5132">nginxinc/nginx-unprivileged:alpine</text>
  <text x="500" y="326" font-size="9" text-anchor="middle" fill="#0f5132">SA: frontend-sa · non-root · caps dropped</text>

  <!-- arrows to backend / worker -->
  <line x1="440" y1="333" x2="300" y2="380" stroke="#1e8a5f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="333" x2="700" y2="380" stroke="#1e8a5f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- backend service + pod -->
  <rect x="170" y="380" width="200" height="35" rx="6" fill="#dbe7fb" stroke="#2952a3" stroke-width="1.5"/>
  <text x="270" y="402" font-size="12" text-anchor="middle" fill="#1a2f66">Service: backend-service</text>
  <line x1="270" y1="415" x2="270" y2="438" stroke="#2952a3" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="438" width="240" height="55" rx="6" fill="#cfe0fa" stroke="#2952a3" stroke-width="1.5"/>
  <text x="270" y="458" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a2f66">Pod: backend</text>
  <text x="270" y="473" font-size="10" text-anchor="middle" fill="#1a2f66">Flask API (devops-backend:v1)</text>
  <text x="270" y="486" font-size="9" text-anchor="middle" fill="#1a2f66">SA: backend-sa · non-root · caps dropped</text>

  <!-- worker service + pod -->
  <rect x="630" y="380" width="200" height="35" rx="6" fill="#f7dbe9" stroke="#a32966" stroke-width="1.5"/>
  <text x="730" y="402" font-size="12" text-anchor="middle" fill="#661a40">Service: worker-service</text>
  <line x1="730" y1="415" x2="730" y2="438" stroke="#a32966" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="610" y="438" width="240" height="55" rx="6" fill="#fac9e0" stroke="#a32966" stroke-width="1.5"/>
  <text x="730" y="458" font-size="12" font-weight="bold" text-anchor="middle" fill="#661a40">Pod: worker</text>
  <text x="730" y="473" font-size="10" text-anchor="middle" fill="#661a40">Flask upload service (devops-worker:v1)</text>
  <text x="730" y="486" font-size="9" text-anchor="middle" fill="#661a40">SA: worker-sa · non-root · caps dropped</text>

  <!-- backend -> postgres -->
  <line x1="270" y1="493" x2="270" y2="540" stroke="#2952a3" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="540" width="200" height="35" rx="6" fill="#e6ddf7" stroke="#5b2e91" stroke-width="1.5"/>
  <text x="270" y="562" font-size="12" text-anchor="middle" fill="#361c57">Service: postgres-service</text>
  <line x1="270" y1="575" x2="270" y2="598" stroke="#5b2e91" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="598" width="240" height="55" rx="6" fill="#ddd0f5" stroke="#5b2e91" stroke-width="1.5"/>
  <text x="270" y="618" font-size="12" font-weight="bold" text-anchor="middle" fill="#361c57">Pod: postgres</text>
  <text x="270" y="633" font-size="10" text-anchor="middle" fill="#361c57">postgres:16-alpine (in-cluster, ephemeral)</text>
  <text x="270" y="646" font-size="9" text-anchor="middle" fill="#361c57">SA: postgres-sa · no PVC · no capability drop*</text>

  <!-- worker -> AWS -->
  <line x1="800" y1="465" x2="920" y2="465" stroke="#a32966" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="920" y="410" width="0" height="0"/>
  <rect x="900" y="380" width="90" height="45" rx="6" fill="#fff3cd" stroke="#997404" stroke-width="1.5"/>
  <text x="945" y="399" font-size="11" text-anchor="middle" fill="#5c4600">AWS S3</text>
  <text x="945" y="413" font-size="8" text-anchor="middle" fill="#5c4600">real bucket</text>
  <line x1="945" y1="425" x2="945" y2="440" stroke="#997404" stroke-width="1.5"/>
  <rect x="900" y="440" width="90" height="45" rx="6" fill="#fff3cd" stroke="#997404" stroke-width="1.5"/>
  <text x="945" y="459" font-size="11" text-anchor="middle" fill="#5c4600">AWS SNS</text>
  <text x="945" y="473" font-size="8" text-anchor="middle" fill="#5c4600">real topic</text>

  <!-- ConfigMap / Secret -->
  <rect x="80" y="700" width="180" height="45" rx="6" fill="#f0f0f0" stroke="#666" stroke-width="1.5"/>
  <text x="170" y="720" font-size="11" text-anchor="middle" fill="#333">ConfigMap: app-config</text>
  <text x="170" y="734" font-size="9" text-anchor="middle" fill="#666">non-sensitive config + nginx.conf</text>

  <rect x="290" y="700" width="180" height="45" rx="6" fill="#f8d7da" stroke="#a32929" stroke-width="1.5"/>
  <text x="380" y="720" font-size="11" text-anchor="middle" fill="#5c1a1a">Secret: app-secrets</text>
  <text x="380" y="734" font-size="9" text-anchor="middle" fill="#5c1a1a">DB password + AWS creds (gitignored)</text>

  <text x="170" y="695" font-size="9" text-anchor="middle" fill="#666">injected into all 4 Pods via env / volume mount ↑</text>

  <!-- NetworkPolicy note -->
  <rect x="520" y="700" width="420" height="65" rx="6" fill="#e2f0d9" stroke="#4a7c2f" stroke-width="1.5"/>
  <text x="730" y="718" font-size="11" font-weight="bold" text-anchor="middle" fill="#2d4a1c">NetworkPolicy (enforced by k3d/k3s netpol controller)</text>
  <text x="730" y="733" font-size="9" text-anchor="middle" fill="#2d4a1c">Default-deny ingress; only frontend→backend, frontend→worker,</text>
  <text x="730" y="746" font-size="9" text-anchor="middle" fill="#2d4a1c">and backend→postgres are explicitly allowed. Verified live with nc.</text>

  <text x="270" y="672" font-size="9" text-anchor="middle" fill="#5b2e91">*postgres keeps root→postgres internal privilege drop (see README)</text>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
